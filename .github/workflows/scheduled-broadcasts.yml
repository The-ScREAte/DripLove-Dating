name: Process Scheduled Broadcasts

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch: # Allow manual triggering for testing

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Process scheduled broadcasts
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::Missing required secrets. Please configure SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in repository settings."
            exit 1
          fi

          curl -X POST \
            '${{ secrets.SUPABASE_URL }}/functions/v1/process-scheduled-broadcasts' \
            -H 'Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' \
            -H 'Content-Type: application/json' \
            --fail-with-body \
            || { echo "::error::Failed to call edge function"; exit 1; }

      - name: Resume queued emails (accounts that hit their daily limit)
        run: |
          curl -X POST \
            '${{ secrets.SUPABASE_URL }}/functions/v1/process-email-queue' \
            -H 'Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}' \
            -H 'Content-Type: application/json' \
            --fail-with-body \
            || { echo "::error::Failed to call process-email-queue"; exit 1; }
