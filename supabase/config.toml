[auth]
# Enable OTP for email verification
enable_signup = true
email_confirm = true
# OTP expiry time (in seconds) - 1 hour
otp_expiry = 3600
# Length of OTP token
otp_length = 6

[auth.email]
# Enable email OTP instead of magic links for certain flows
enable_confirmations = true

