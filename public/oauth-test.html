<!DOCTYPE html>
<html>
<head>
    <title>OAuth Test</title>
</head>
<body>
    <h1>Google OAuth Direct Test</h1>
    
    <p><strong>Current URL:</strong> <span id="current-url"></span></p>
    <p><strong>Expected Redirect URI:</strong> http://localhost:8080/auth/callback</p>
    
    <button onclick="testOAuth()">Test Google OAuth</button>
    
    <div id="debug-info"></div>
    
    <script>
        document.getElementById('current-url').textContent = window.location.href;
        
        async function testOAuth() {
            const clientId = '825202507247-dpodo6bfbbcknm06ls48mm17ph51cvo8.apps.googleusercontent.com';
            const redirectUri = 'http://localhost:8080/auth/callback';
            const scope = 'email profile';
            
            const params = new URLSearchParams({
                client_id: clientId,
                redirect_uri: redirectUri,
                response_type: 'code',
                scope: scope,
                access_type: 'offline',
                prompt: 'select_account'
            });
            
            const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
            
            document.getElementById('debug-info').innerHTML = `
                <h3>Debug Info:</h3>
                <p><strong>Auth URL:</strong> ${authUrl}</p>
                <p><strong>Client ID:</strong> ${clientId}</p>
                <p><strong>Redirect URI:</strong> ${redirectUri}</p>
                <p>Opening Google OAuth...</p>
            `;
            
            window.location.href = authUrl;
        }
    </script>
</body>
</html>
