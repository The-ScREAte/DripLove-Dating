<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Processing - DripLove</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .fallback-btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        .fallback-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        .debug {
            margin-top: 1rem;
            font-size: 0.8rem;
            opacity: 0.7;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Payment Processing...</h2>
        <p>Redirecting you back to DripLove app...</p>
        <p><small>Reference: <span id="reference">Loading...</span></small></p>
        
        <a href="#" id="fallback-btn" class="fallback-btn">
            Continue in Browser
        </a>
        
        <div id="mode-info" style="margin-top: 1rem; font-size: 0.8rem; opacity: 0.7;">
            <p>📱 Trying to open mobile app...</p>
            <p>If app doesn't open, click the button above</p>
        </div>

        <div id="debug-info" class="debug" style="display: none;">
            <strong>Debug Info:</strong><br>
            Reference: <span id="debug-reference">-</span><br>
            Status: <span id="debug-status">-</span><br>
            Payment Type: <span id="debug-payment-type">-</span><br>
            Deep Link: <span id="debug-deep-link">-</span><br>
            Web Fallback: <span id="debug-web-fallback">-</span><br>
            Is Localhost: <span id="debug-localhost">-</span>
        </div>
    </div>

    <script>
        // Parse URL parameters
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                reference: params.get('reference') || params.get('trxref') || params.get('tx_ref') || 'N/A',
                status: params.get('status') || 'unknown',
                paymentType: params.get('payment_type') || 'unknown'
            };
        }

        // Detect environment
        function isLocalhost() {
            return window.location.hostname === 'localhost' || 
                   window.location.hostname === '127.0.0.1' ||
                   window.location.hostname.includes('localhost') ||
                   window.location.search.includes('dev=true');
        }

        // Initialize the page
        function init() {
            const params = getUrlParams();
            const localhost = isLocalhost();
            
            // Update UI with parsed data
            document.getElementById('reference').textContent = params.reference;
            
            // Create URLs
            const deepLink = `driplove://payment/callback?reference=${encodeURIComponent(params.reference)}&status=${encodeURIComponent(params.status)}&payment_type=${encodeURIComponent(params.paymentType)}`;
            
            let webFallback;
            if (localhost) {
                webFallback = `http://localhost:5173/payment-success?reference=${encodeURIComponent(params.reference)}&status=${encodeURIComponent(params.status)}&payment_type=${encodeURIComponent(params.paymentType)}`;
                document.getElementById('mode-info').innerHTML = `
                    <p>🔧 Development Mode Active</p>
                    <p>Redirecting to localhost:5173</p>
                `;
            } else {
                webFallback = `/payment-success?reference=${encodeURIComponent(params.reference)}&status=${encodeURIComponent(params.status)}&payment_type=${encodeURIComponent(params.paymentType)}`;
            }
            
            // Update fallback button
            document.getElementById('fallback-btn').href = webFallback;
            
            // Show debug info if needed
            if (localhost || window.location.search.includes('debug=true')) {
                document.getElementById('debug-info').style.display = 'block';
                document.getElementById('debug-reference').textContent = params.reference;
                document.getElementById('debug-status').textContent = params.status;
                document.getElementById('debug-payment-type').textContent = params.paymentType;
                document.getElementById('debug-deep-link').textContent = deepLink;
                document.getElementById('debug-web-fallback').textContent = webFallback;
                document.getElementById('debug-localhost').textContent = localhost;
            }
            
            console.log('Paystack redirect bridge loaded', {
                reference: params.reference,
                status: params.status,
                paymentType: params.paymentType,
                deepLink: deepLink,
                webFallback: webFallback,
                isLocalhost: localhost
            });

            // Smart redirect logic
            function redirectToApp() {
                try {
                    // On localhost/development, prefer web fallback for easier testing
                    if (localhost) {
                        console.log('Development mode detected, redirecting to localhost');
                        window.location.href = webFallback;
                        return;
                    }
                    
                    // On mobile/production, try deep link first
                    console.log('Attempting deep link redirect');
                    window.location.href = deepLink;
                    
                    // Set a timeout to fallback to web if deep link doesn't work
                    setTimeout(() => {
                        console.log('Deep link timeout, falling back to web');
                        window.location.href = webFallback;
                    }, 3000);
                    
                } catch (error) {
                    console.error('Redirect failed:', error);
                    window.location.href = webFallback;
                }
            }

            // Redirect immediately when page loads
            redirectToApp();
            
            // Also try again after a short delay in case the first attempt fails
            setTimeout(() => {
                if (!localhost) {
                    redirectToApp();
                }
            }, 500);
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
