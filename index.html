
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />

    <!-- Casual brush/handwriting font used for the header tagline and the
         swipe-guide tagline (see .font-brush in index.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">

    <!-- ⭐ SEO / AI-SEO: this <head> is the entire crawlable surface of the
         app - it's a client-rendered SPA (see <div id="root"> below), so a
         crawler or AI answer-engine bot that doesn't execute JS only ever
         sees what's written here, never the live in-app screens. That's
         deliberate: the marketing claims below belong here, in metadata
         search engines and AI crawlers read, not inside the actual app UI
         users navigate. -->
    <title>DripLove - Slide Into Real Love</title>
    <meta name="description" content="Slide into something real, just like other normal people. Meet real people, find real love, and connect locally and worldwide with a location of your choice. DripLove is ranked as one of the top dating apps that actually focus on meaningful matching - not generic, but real ones that lead to something real. Just your like-minded match." />
    <meta name="keywords" content="top dating app, meaningful matching, real connections, dating app, online dating, meet singles, local dating, international dating, find your match, verified dating profiles, DripLove" />
    <meta name="author" content="DripLove" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.driplove.love/" />

    <meta property="og:title" content="DripLove - Slide Into Real Love" />
    <meta property="og:description" content="Slide into something real, just like other normal people. Meet real people, find real love, and connect locally and worldwide with a location of your choice. DripLove is ranked as one of the top dating apps that actually focus on meaningful matching - not generic, but real ones that lead to something real." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.driplove.love/" />
    <meta property="og:site_name" content="DripLove" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://www.driplove.love/driplove-logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@driplove" />
    <meta name="twitter:title" content="DripLove - Slide Into Real Love" />
    <meta name="twitter:description" content="Slide into something real, just like other normal people. Meet real people, find real love, and connect locally and worldwide with a location of your choice." />
    <meta name="twitter:image" content="https://www.driplove.love/driplove-logo.png" />

    <!-- Structured data so search engines and AI answer engines (ChatGPT,
         Perplexity, Google AI Overviews, etc.) can parse what DripLove is,
         not just guess from prose. Deliberately no aggregateRating/review
         block here - fabricating star ratings in structured data is exactly
         the kind of thing that gets a site penalized, not promoted. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DripLove",
      "url": "https://www.driplove.love/",
      "logo": "https://www.driplove.love/driplove-logo.png",
      "description": "DripLove helps you meet real people and find real love, connecting you locally or worldwide through meaningful matching and verified profiles.",
      "sameAs": [
        "https://twitter.com/driplove"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MobileApplication",
      "name": "DripLove",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "iOS, Android, Web",
      "url": "https://www.driplove.love/",
      "description": "DripLove helps you meet real people and find real love, connecting you locally or worldwide, wherever you choose, through meaningful matching and verified profiles.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Apple Sign-In Domain Verification -->
    <meta name="appleid-signin-client-id" content="com.driplove.dating.signin">
    <meta name="appleid-signin-scope" content="name email">
    <meta name="appleid-signin-redirect-uri" content="">
    <meta name="appleid-signin-state" content="">
    <meta name="appleid-signin-use-popup" content="true">

    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
